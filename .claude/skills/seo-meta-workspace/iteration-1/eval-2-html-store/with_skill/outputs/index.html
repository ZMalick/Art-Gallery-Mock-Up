<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechShop — Best Developer Gear & Accessories</title>
  <meta name="description" content="Shop top-rated developer gear at TechShop. Mechanical keyboards, USB-C hubs, and more — quality tools for developers at great prices.">
  <link rel="canonical" href="https://techshop.example.com/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://techshop.example.com/">
  <meta property="og:title" content="TechShop — Best Developer Gear & Accessories">
  <meta property="og:description" content="Shop top-rated developer gear at TechShop. Mechanical keyboards, USB-C hubs, and more.">
  <meta property="og:image" content="https://techshop.example.com/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="TechShop">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TechShop — Best Developer Gear & Accessories">
  <meta name="twitter:description" content="Shop top-rated developer gear at TechShop. Mechanical keyboards, USB-C hubs, and more.">
  <meta name="twitter:image" content="https://techshop.example.com/images/og-image.jpg">

  <!-- JSON-LD: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "TechShop",
    "url": "https://techshop.example.com",
    "logo": "https://techshop.example.com/images/logo.png"
  }
  </script>

  <!-- JSON-LD: WebSite with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TechShop",
    "url": "https://techshop.example.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://techshop.example.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- JSON-LD: Product listings -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Mechanical Keyboard",
      "image": "https://techshop.example.com/images/p1.jpg",
      "description": "High-quality mechanical keyboard for developers",
      "offers": {
        "@type": "Offer",
        "price": "89.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://techshop.example.com/products/mechanical-keyboard"
      }
    },
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "USB-C Hub",
      "image": "https://techshop.example.com/images/p2.jpg",
      "description": "Multi-port USB-C hub for developers",
      "offers": {
        "@type": "Offer",
        "price": "45.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://techshop.example.com/products/usb-c-hub"
      }
    }
  ]
  </script>
</head>
<body>
  <header>
    <img src="logo.png" alt="TechShop logo">
  </header>
  <main>
    <h1>Welcome to TechShop</h1>
    <h2>Best products for developers</h2>
    <p><a href="/sale">Shop our current sale</a> and save on developer gear!</p>
    <section class="products">
      <div>
        <img src="p1.jpg" alt="Mechanical keyboard with backlit keys">
        <p>Mechanical Keyboard - $89</p>
      </div>
      <div>
        <img src="p2.jpg" alt="USB-C hub with multiple ports">
        <p>USB-C Hub - $45</p>
      </div>
    </section>
    <a href="/about">Learn more about TechShop</a>
  </main>
</body>
</html>
