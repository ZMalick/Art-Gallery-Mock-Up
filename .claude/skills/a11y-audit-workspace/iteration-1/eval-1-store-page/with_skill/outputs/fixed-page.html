<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Store - Featured Products</title>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: #fff;
      padding: 8px 16px;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 0;
    }
    .product-link {
      text-decoration: none;
      color: inherit;
      display: block;
      cursor: pointer;
    }
    .product-link:focus-visible {
      outline: 2px solid #005fcc;
      outline-offset: 2px;
    }
    .subscribe-btn {
      background: blue;
      color: white;
      padding: 5px 10px;
      display: inline-block;
      cursor: pointer;
      border: none;
      font-size: inherit;
      font-family: inherit;
    }
    .subscribe-btn:focus-visible {
      outline: 2px solid #005fcc;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <a href="/"><img src="logo.png" alt="Store home"></a>
      <a href="/products">Products</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero">
      <h1 style="color: #595959; background: #fff; font-size: 14px;">Welcome to our store</h1>
    </section>

    <section class="products" aria-labelledby="products-heading">
      <h2 id="products-heading">Featured Products</h2>
      <a href="/product/1" class="product-link">
        <img src="product1.jpg" alt="Cool Widget">
        <span>Cool Widget</span>
        <span>$29.99</span>
      </a>
    </section>

    <section class="newsletter" aria-labelledby="subscribe-heading">
      <h2 id="subscribe-heading">Subscribe</h2>
      <form onsubmit="subscribe(); return false;">
        <label for="newsletter-email">Your email</label>
        <input type="email" id="newsletter-email" placeholder="Your email" autocomplete="email" aria-required="true" required>
        <button type="submit" class="subscribe-btn">Subscribe</button>
      </form>
    </section>
  </main>
</body>
</html>
