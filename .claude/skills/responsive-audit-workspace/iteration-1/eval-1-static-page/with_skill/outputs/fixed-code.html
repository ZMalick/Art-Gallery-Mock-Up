<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  .wrapper {
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  nav a {
    display: inline-block;
    padding: 0.75rem 1rem;
    min-height: 44px;
    min-width: 44px;
    text-decoration: none;
    color: inherit;
  }

  .content {
    display: flex;
    flex-wrap: wrap;
    gap: 1.875rem;
  }

  main {
    flex: 1;
    min-width: 0;
  }

  main h1 {
    font-size: clamp(1.75rem, 4vw, 2.625rem);
  }

  main p {
    font-size: 1rem;
    line-height: 1.6;
    max-width: 65ch;
  }

  main img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  main button {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
  }

  aside {
    width: 280px;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .content {
      flex-direction: column;
    }

    aside {
      width: 100%;
    }
  }

  @media (max-width: 480px) {
    nav {
      flex-direction: column;
    }

    .wrapper {
      padding: 0 0.75rem;
    }
  }
</style>
</head>
<body>
<div class="wrapper">
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>
  <div class="content">
    <main>
      <h1>Welcome</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
      <img src="hero.jpg" alt="Hero image">
      <button>Click me</button>
    </main>
    <aside>Sidebar content</aside>
  </div>
</div>
</body>
</html>
